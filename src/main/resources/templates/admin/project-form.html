<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew} ? 'Add Project' : 'Edit Project'">Project Form | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white">
            <div class="p-4">
                <h1 class="text-2xl font-bold">Portfolio Admin</h1>
            </div>
            <nav class="mt-6">
                <a href="/admin" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/projects" class="flex items-center py-3 px-4 bg-gray-700">
                    <i class="fas fa-project-diagram mr-3"></i>
                    <span>Projects</span>
                </a>
                <a href="/admin/skills" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-code mr-3"></i>
                    <span>Skills</span>
                </a>
                <a href="/admin/contacts" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-envelope mr-3"></i>
                    <span>Messages</span>
                </a>
                <a href="/" class="flex items-center py-3 px-4 hover:bg-gray-700 mt-8">
                    <i class="fas fa-eye mr-3"></i>
                    <span>View Site</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <header class="bg-white shadow">
                <div class="py-4 px-6">
                    <h2 class="text-xl font-semibold" th:text="${isNew} ? 'Add New Project' : 'Edit Project'">Project Form</h2>
                </div>
            </header>

            <main class="p-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <form th:action="@{/admin/projects/save}" th:object="${project}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-4">
                            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                            <input type="text" id="title" th:field="*{title}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                            <textarea id="description" th:field="*{description}" rows="4"
                                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                      required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="imageFile" class="block text-sm font-medium text-gray-700 mb-1">Project Image</label>

                            <!-- Show current image if it exists -->
                            <div th:if="${project.imageUrl != null && !project.imageUrl.isEmpty()}" class="mb-3">
                                <div class="relative w-40 h-40 mb-2 border rounded-md overflow-hidden">
                                    <img th:src="${project.imageUrl}" alt="Current project image" class="w-full h-full object-cover">
                                </div>
                                <div class="flex items-center">
                                    <input type="checkbox" id="deleteExistingImage" name="deleteExistingImage" class="mr-2">
                                    <label for="deleteExistingImage" class="text-sm text-red-500">Delete current image</label>
                                </div>
                                <input type="hidden" th:field="*{imageUrl}">
                            </div>

                            <!-- File upload input -->
                            <div class="mt-2">
                                <input type="file" id="imageFile" name="imageFile" accept="image/*"
                                       class="block w-full text-sm text-gray-500
                                              file:mr-4 file:py-2 file:px-4
                                              file:rounded-md file:border-0
                                              file:text-sm file:font-semibold
                                              file:bg-blue-50 file:text-blue-700
                                              hover:file:bg-blue-100">
                                <p class="mt-1 text-sm text-gray-500">Upload a project image (JPG, PNG, GIF)</p>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <select id="category" th:field="*{category}"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                    required>
                                <option value="">Select a category</option>
                                <option value="Full Stack">Full Stack</option>
                                <option value="Frontend">Frontend</option>
                                <option value="Backend">Backend</option>
                                <option value="Mobile">Mobile</option>
                                <option value="AI Integration">AI Integration</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="technologies" class="block text-sm font-medium text-gray-700 mb-1">Technologies</label>
                            <input type="text" id="technologies" th:field="*{technologies}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                                   required>
                            <p class="mt-1 text-sm text-gray-500">Enter technologies separated by commas (e.g., React, Node.js, MongoDB)</p>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div>
                                <label for="githubUrl" class="block text-sm font-medium text-gray-700 mb-1">GitHub URL</label>
                                <input type="url" id="githubUrl" th:field="*{githubUrl}"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            </div>

                            <div>
                                <label for="liveUrl" class="block text-sm font-medium text-gray-700 mb-1">Live Demo URL</label>
                                <input type="url" id="liveUrl" th:field="*{liveUrl}"
                                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>

                        <div class="flex justify-end space-x-3">
                            <a href="/admin/projects" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                                Cancel
                            </a>
                            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                                Save Project
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
</body>
</html>

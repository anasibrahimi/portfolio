<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew} ? 'Add Skill' : 'Edit Skill'">Skill Form | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white">
            <div class="p-4">
                <h1 class="text-2xl font-bold">Portfolio Admin</h1>
            </div>
            <nav class="mt-6">
                <a href="/admin" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/projects" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-project-diagram mr-3"></i>
                    <span>Projects</span>
                </a>
                <a href="/admin/skills" class="flex items-center py-3 px-4 bg-gray-700">
                    <i class="fas fa-code mr-3"></i>
                    <span>Skills</span>
                </a>
                <a href="/admin/contacts" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-envelope mr-3"></i>
                    <span>Messages</span>
                </a>
                <a href="/" class="flex items-center py-3 px-4 hover:bg-gray-700 mt-8">
                    <i class="fas fa-eye mr-3"></i>
                    <span>View Site</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <header class="bg-white shadow">
                <div class="py-4 px-6">
                    <h2 class="text-xl font-semibold" th:text="${isNew} ? 'Add New Skill' : 'Edit Skill'">Skill Form</h2>
                </div>
            </header>

            <main class="p-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <form th:action="@{/admin/skills/save}" th:object="${skill}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-4">
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Skill Name</label>
                            <input type="text" id="name" th:field="*{name}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <select id="category" th:field="*{category}"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-purple-500 focus:border-purple-500"
                                    required>
                                <option value="">Select a category</option>
                                <option value="Frontend">Frontend</option>
                                <option value="Backend">Backend</option>
                                <option value="Database">Database</option>
                                <option value="DevOps">DevOps</option>
                                <option value="Tools">Tools</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="proficiency" class="block text-sm font-medium text-gray-700 mb-1">Proficiency (%)</label>
                            <input type="range" id="proficiency" th:field="*{proficiency}" min="0" max="100" step="5"
                                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                                   oninput="proficiencyValue.innerText = this.value + '%'">
                            <div class="flex justify-between mt-1">
                                <span class="text-xs text-gray-500">Beginner</span>
                                <span id="proficiencyValue" class="text-xs font-medium" th:text="${skill.proficiency != null ? skill.proficiency + '%' : '50%'}">50%</span>
                                <span class="text-xs text-gray-500">Expert</span>
                            </div>
                        </div>

                        <div class="mb-6">
                            <label for="iconClass" class="block text-sm font-medium text-gray-700 mb-1">Icon Class</label>
                            <input type="text" id="iconClass" th:field="*{iconClass}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-purple-500 focus:border-purple-500">
                            <p class="mt-1 text-sm text-gray-500">Enter a Font Awesome icon class (e.g., fas fa-code, fab fa-react)</p>

                            <div class="mt-3 grid grid-cols-2 md:grid-cols-4 gap-2">
                                <button type="button" class="p-2 border rounded-md flex items-center justify-center hover:bg-gray-50" onclick="selectIcon('fas fa-code')">
                                    <i class="fas fa-code mr-2"></i> Code
                                </button>
                                <button type="button" class="p-2 border rounded-md flex items-center justify-center hover:bg-gray-50" onclick="selectIcon('fab fa-react')">
                                    <i class="fab fa-react mr-2"></i> React
                                </button>
                                <button type="button" class="p-2 border rounded-md flex items-center justify-center hover:bg-gray-50" onclick="selectIcon('fab fa-node-js')">
                                    <i class="fab fa-node-js mr-2"></i> Node.js
                                </button>
                                <button type="button" class="p-2 border rounded-md flex items-center justify-center hover:bg-gray-50" onclick="selectIcon('fas fa-database')">
                                    <i class="fas fa-database mr-2"></i> Database
                                </button>
                            </div>
                        </div>

                        <div class="flex justify-end space-x-3">
                            <a href="/admin/skills" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                                Cancel
                            </a>
                            <button type="submit" class="px-4 py-2 bg-purple-500 text-white rounded-md hover:bg-purple-600">
                                Save Skill
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script>
        function selectIcon(iconClass) {
            document.getElementById('iconClass').value = iconClass;
        }
    </script>
</body>
</html>

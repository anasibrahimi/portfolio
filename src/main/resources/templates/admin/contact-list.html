<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white">
            <div class="p-4">
                <h1 class="text-2xl font-bold">Portfolio Admin</h1>
            </div>
            <nav class="mt-6">
                <a href="/admin" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/projects" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-project-diagram mr-3"></i>
                    <span>Projects</span>
                </a>
                <a href="/admin/skills" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-code mr-3"></i>
                    <span>Skills</span>
                </a>
                <a href="/admin/contacts" class="flex items-center py-3 px-4 bg-gray-700">
                    <i class="fas fa-envelope mr-3"></i>
                    <span>Messages</span>
                    <span th:if="${unreadCount > 0}" class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full" th:text="${unreadCount}">0</span>
                </a>
                <a href="/" class="flex items-center py-3 px-4 hover:bg-gray-700 mt-8">
                    <i class="fas fa-eye mr-3"></i>
                    <span>View Site</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <header class="bg-white shadow">
                <div class="py-4 px-6">
                    <h2 class="text-xl font-semibold">Messages</h2>
                </div>
            </header>

            <main class="p-6">
                <!-- Alert Messages -->
                <div th:if="${success}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6" role="alert">
                    <p th:text="${success}">Success message</p>
                </div>

                <div th:if="${error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" role="alert">
                    <p th:text="${error}">Error message</p>
                </div>

                <!-- Messages Table -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Status
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    From
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Subject
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Date
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:if="${contacts.empty}">
                                <td colspan="5" class="px-6 py-4 text-center text-gray-500">
                                    No messages found.
                                </td>
                            </tr>
                            <tr th:each="contact : ${contacts}" th:class="${!contact.read ? 'bg-blue-50' : ''}">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span th:if="${!contact.read}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                                        <i class="fas fa-envelope mr-1"></i> New
                                    </span>
                                    <span th:unless="${!contact.read}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                                        <i class="fas fa-envelope-open mr-1"></i> Read
                                    </span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="flex items-center">
                                        <div class="ml-4">
                                            <div class="text-sm font-medium text-gray-900" th:text="${contact.name}">Name</div>
                                            <div class="text-sm text-gray-500" th:text="${contact.email}">Email</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm text-gray-900" th:text="${contact.subject}">Subject</div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#dates.format(contact.createdAt, 'MMM dd, yyyy HH:mm')}">
                                    Date
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <a th:href="@{/admin/contacts/{id}(id=${contact.id})}" class="text-blue-600 hover:text-blue-900 mr-3">
                                        <i class="fas fa-eye"></i> View
                                    </a>
                                    <a th:href="@{/admin/contacts/delete/{id}(id=${contact.id})}"
                                       class="text-red-600 hover:text-red-900"
                                       onclick="return confirm('Are you sure you want to delete this message?')">
                                        <i class="fas fa-trash-alt"></i> Delete
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
</body>
</html>

# Application name
spring.application.name=portfolio

# Activate profile (can be overridden by env var SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ====== Database Configuration ======
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=${DB_DIALECT}

# Let Spring auto-create or update tables
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# JPA Settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File upload directory
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Admin credentials (used wherever you need them)
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

# Logging (optional)
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.thymeleaf=INFO

# Server port (optional override)
server.port=${SERVER_PORT:8080}

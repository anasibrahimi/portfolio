<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-gray-800 text-white">
            <div class="p-4">
                <h1 class="text-2xl font-bold">Portfolio Admin</h1>
            </div>
            <nav class="mt-6">
                <a href="/admin" class="flex items-center py-3 px-4 bg-gray-700">
                    <i class="fas fa-tachometer-alt mr-3"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/projects" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-project-diagram mr-3"></i>
                    <span>Projects</span>
                </a>
                <a href="/admin/skills" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-code mr-3"></i>
                    <span>Skills</span>
                </a>
                <a href="/admin/contacts" class="flex items-center py-3 px-4 hover:bg-gray-700">
                    <i class="fas fa-envelope mr-3"></i>
                    <span>Messages</span>
                    <span th:if="${unreadCount > 0}" class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full" th:text="${unreadCount}">0</span>
                </a>
                <a href="/" class="flex items-center py-3 px-4 hover:bg-gray-700 mt-8">
                    <i class="fas fa-eye mr-3"></i>
                    <span>View Site</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <header class="bg-white shadow">
                <div class="py-4 px-6">
                    <h2 class="text-xl font-semibold">Dashboard</h2>
                </div>
            </header>

            <main class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Projects Card -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-blue-100 text-blue-500">
                                <i class="fas fa-project-diagram text-2xl"></i>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-lg font-semibold">Projects</h3>
                                <p class="text-3xl font-bold" th:text="${projectCount}">0</p>
                            </div>
                        </div>
                        <div class="mt-4">
                            <a href="/admin/projects" class="text-blue-500 hover:underline">
                                Manage Projects <i class="fas fa-arrow-right ml-1"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Skills Card -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-purple-100 text-purple-500">
                                <i class="fas fa-code text-2xl"></i>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-lg font-semibold">Skills</h3>
                                <p class="text-3xl font-bold" th:text="${skillCount}">0</p>
                            </div>
                        </div>
                        <div class="mt-4">
                            <a href="/admin/skills" class="text-purple-500 hover:underline">
                                Manage Skills <i class="fas fa-arrow-right ml-1"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Messages Card -->
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-3 rounded-full bg-green-100 text-green-500">
                                <i class="fas fa-envelope text-2xl"></i>
                            </div>
                            <div class="ml-4">
                                <h3 class="text-lg font-semibold">Messages</h3>
                                <div class="flex items-center">
                                    <p class="text-3xl font-bold" th:text="${contactCount}">0</p>
                                    <span th:if="${unreadCount > 0}" class="ml-2 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">
                                        <span th:text="${unreadCount}">0</span> new
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <a href="/admin/contacts" class="text-green-500 hover:underline">
                                View Messages <i class="fas fa-arrow-right ml-1"></i>
                            </a>
                        </div>
                    </div>
                </div>

                <div class="mt-8 bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold mb-4">Quick Actions</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <a href="/admin/projects/new" class="flex items-center p-4 border rounded-lg hover:bg-gray-50">
                            <div class="p-2 rounded-full bg-blue-100 text-blue-500">
                                <i class="fas fa-plus"></i>
                            </div>
                            <span class="ml-3">Add New Project</span>
                        </a>
                        <a href="/admin/skills/new" class="flex items-center p-4 border rounded-lg hover:bg-gray-50">
                            <div class="p-2 rounded-full bg-purple-100 text-purple-500">
                                <i class="fas fa-plus"></i>
                            </div>
                            <span class="ml-3">Add New Skill</span>
                        </a>
                        <a href="/admin/contacts" class="flex items-center p-4 border rounded-lg hover:bg-gray-50">
                            <div class="p-2 rounded-full bg-green-100 text-green-500">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <span class="ml-3">Check Messages</span>
                            <span th:if="${unreadCount > 0}" class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full" th:text="${unreadCount}">0</span>
                        </a>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>

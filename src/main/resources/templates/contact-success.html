<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Alex Carter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full p-8 bg-white dark:bg-gray-800 rounded-xl shadow-lg">
            <div class="text-center">
                <div class="w-20 h-20 bg-green-100 dark:bg-green-900 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-check text-green-500 dark:text-green-300 text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold mb-2">Message Sent!</h1>
                <p class="text-gray-600 dark:text-gray-300 mb-8">
                    Thank you for reaching out. I'll get back to you as soon as possible.
                </p>
                <a href="/" class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg font-medium hover:opacity-90 transition inline-flex items-center">
                    <i class="fas fa-arrow-left mr-2"></i> Back to Portfolio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
